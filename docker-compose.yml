# ---------------------------------------------------------------------------
# Local development / self-hosting for speech-bridge.
#   docker compose up --build
# Configuration comes from a local .env file (copy from .env.example).
# The model-cache named volume persists the whisper download across restarts.
# ---------------------------------------------------------------------------
services:
  speech-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: speech-bridge:latest
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Ensure the in-container cache path matches the mounted volume.
      HF_HOME: /models
      XDG_CACHE_HOME: /models
    volumes:
      - model-cache:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
    # Uncomment to grant GPU access (requires nvidia-container-toolkit and a
    # CUDA-enabled image build):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  model-cache:
